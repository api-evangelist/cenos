aid: cenos
name: Cenos
description: >-
  CENOS is an engineering simulation software company founded in 2017 in Riga,
  Latvia, that packages academically proven open-source solvers (Salome, GetDP,
  and Elmer FEM) into focused, affordable desktop applications for practical
  engineers. Its products cover electromagnetic and thermal simulation use cases
  including induction heating, radio-frequency antenna design, wireless charging,
  electromagnetic stirring of liquid metals, and busbar heating, promising faster
  product development and lower cost than traditional CAE suites. CENOS is a
  subscription desktop product with CAD import, one-click PDF reports, and live
  expert support; it does not currently publish a public API, SDK, or developer
  platform. Backed by 500 Global, Startup Wise Guys, and Capitalia.
